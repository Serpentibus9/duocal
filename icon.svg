<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- DuoCal icon: a bear hugging a little bunny, a heart held between them. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2b2050"/><stop offset=".55" stop-color="#140f26"/><stop offset="1" stop-color="#07060c"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a6e" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a6e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b07a50"/><stop offset="1" stop-color="#875632"/></linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d63"/><stop offset="1" stop-color="#c1121f"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="78" cy="96" r="3" opacity=".8"/><circle cx="440" cy="80" r="2.5" opacity=".7"/><circle cx="458" cy="210" r="2" opacity=".6"/>
    <circle cx="52" cy="250" r="2" opacity=".6"/><circle cx="120" cy="40" r="1.8" opacity=".5"/><circle cx="392" cy="140" r="1.6" opacity=".5"/>
    <path d="M430 300l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#39e87a" opacity=".9"/>
    <path d="M86 330l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#f7d774" opacity=".9"/>
  </g>
  <!-- bear body -->
  <ellipse cx="256" cy="470" rx="178" ry="120" fill="url(#fur)"/>
  <!-- bear ears -->
  <circle cx="150" cy="112" r="48" fill="url(#fur)"/><circle cx="150" cy="112" r="25" fill="#e3ad82"/>
  <circle cx="362" cy="112" r="48" fill="url(#fur)"/><circle cx="362" cy="112" r="25" fill="#e3ad82"/>
  <!-- bear head -->
  <circle cx="256" cy="200" r="120" fill="url(#fur)"/>
  <ellipse cx="256" cy="238" rx="56" ry="42" fill="#efcfae"/>
  <ellipse cx="256" cy="222" rx="19" ry="14" fill="#3a2416"/>
  <path d="M256 236v12M238 254c10 8 26 8 36 0" stroke="#3a2416" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- happy closed eyes -->
  <path d="M196 186c9-12 25-12 34 0M282 186c9-12 25-12 34 0" stroke="#3a2416" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="186" cy="226" r="14" fill="#ff8fa0" opacity=".45"/><circle cx="326" cy="226" r="14" fill="#ff8fa0" opacity=".45"/>
  <!-- bunny ears (resting on the bear's chin) -->
  <g transform="rotate(-14 226 318)"><ellipse cx="226" cy="300" rx="20" ry="56" fill="#fbf7f2"/><ellipse cx="226" cy="304" rx="9" ry="40" fill="#ffc2cc"/></g>
  <g transform="rotate(14 288 318)"><ellipse cx="288" cy="300" rx="20" ry="56" fill="#fbf7f2"/><ellipse cx="288" cy="304" rx="9" ry="40" fill="#ffc2cc"/></g>
  <!-- bunny head and body -->
  <ellipse cx="256" cy="440" rx="62" ry="52" fill="#f3ece3"/>
  <circle cx="256" cy="376" r="54" fill="#fbf7f2"/>
  <circle cx="236" cy="370" r="6" fill="#2a1d14"/><circle cx="276" cy="370" r="6" fill="#2a1d14"/>
  <circle cx="238" cy="368" r="2" fill="#fff"/><circle cx="278" cy="368" r="2" fill="#fff"/>
  <path d="M250 386l6 5 6-5z" fill="#ff8fa0"/>
  <path d="M256 391c-4 6-10 7-14 4M256 391c4 6 10 7 14 4" stroke="#c98f98" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="222" cy="386" r="9" fill="#ffb3c0" opacity=".55"/><circle cx="290" cy="386" r="9" fill="#ffb3c0" opacity=".55"/>
  <!-- the heart, held between them -->
  <circle cx="256" cy="448" r="56" fill="url(#glow)"/>
  <path d="M256 478c-28-18-42-32-42-48a20 20 0 0 1 42-8 20 20 0 0 1 42 8c0 16-14 30-42 48z" fill="url(#heart)"/>
  <path d="M236 424c4-6 11-8 17-5" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".6"/>
  <!-- the bear's arms wrapped around the bunny -->
  <path d="M96 400c10 50 60 86 120 84 12 0 20-12 14-22-6-10-20-10-32-12-40-4-68-30-74-62z" fill="url(#fur)"/>
  <path d="M416 400c-10 50-60 86-120 84-12 0-20-12-14-22 6-10 20-10 32-12 40-4 68-30 74-62z" fill="url(#fur)"/>
  <ellipse cx="214" cy="470" rx="24" ry="18" fill="#9a6542"/><ellipse cx="298" cy="470" rx="24" ry="18" fill="#9a6542"/>
  <path d="M202 466h6M214 462v6M226 466h-6M286 466h6M298 462v6M310 466h-6" stroke="#6b4325" stroke-width="3" stroke-linecap="round"/>
</svg>
